<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Refine – First-Home Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f4f8fb;padding:20px;max-width:600px;margin:auto}
    h2{margin-top:0}
    label{font-weight:bold;display:block;margin-top:15px}
    input[type=range]{width:100%}
    .bar{background:#e0e0e0;height:20px;border-radius:10px;margin:20px 0;overflow:hidden}
    .bar div{height:100%;background:#28a745;width:82%}
    .btn{display:inline-block;padding:10px 24px;background:#0077cc;color:#fff;border:none;border-radius:4px;font-size:16px;text-decoration:none}
  </style>
</head>
<body>
  <h2>Tweak your priorities</h2>
  <label>Schools importance <span id="v1">50</span>%</label>
  <input type="range" min="0" max="100" value="50" oninput="updateBar()">

  <label>Green space <span id="v2">50</span>%</label>
  <input type="range" min="0" max="100" value="50" oninput="updateBar()">

  <label>Cafés / shops <span id="v3">50</span>%</label>
  <input type="range" min="0" max="100" value="50" oninput="updateBar()">

  <div class="bar"><div id="confBar"></div></div>
  <p id="confTxt">Confidence: 82 %</p>


  <a class="btn" href="index.html">Start over</a>

  <script>
    function updateBar(){
      const s1 = document.querySelector('input').value;
      document.getElementById('v1').textContent = s1;
      const s2 = document.querySelectorAll('input')[1].value;
      document.getElementById('v2').textContent = s2;
      const s3 = document.querySelectorAll('input')[2].value;
      document.getElementById('v3').textContent = s3;
      // fake confidence
      const conf = 60 + Math.floor(Math.random()*25);
      document.getElementById('confBar').style.width = conf + '%';
      document.getElementById('confTxt').textContent = 'Confidence: ' + conf + ' %';
    }
    updateBar();
  </script>
</body>
</html>
