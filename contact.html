<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./assets/css/main.css" />
    <script src="./assets/js/contact.js"></script>
    <title>Contact - Personal Portfolio</title>
  </head>
  <body class="body-container">
    <section class="header-container">
      <!-- Header -->
      <header class="html-header">
        <h1>Contact</h1>
        <img
          src="./assets/img/bars-solid.svg"
          alt="Menu"
          class="hamburger-bar"
          id="hamburger-bar-id"
        />
        <!--Navigation Links-->
        <nav id="header-nav-container-id" class="header-nav-container">
          <a href="./index.html">Home</a>
          <a href="./about.html">About</a>
          <a href="./resume.html">Resume</a>
          <a href="./projects.html">Projects</a>
          <a href="./mywork.html">Mywork</a>
          <a href="./contact.html">Contact</a>
        </nav>
      </header>
    </section>

    <!-- Main Content -->
    <main>
      <section class="main-container">
        <!--wide article x-->

        <h3 id="contact-form-error-text" class="contact-form-error"></h3>
        <article class="wide-article-container">
          <form action="#" method="post" class="contact-form-container">
            <!-- Name Row -->
            <section class="form-group">
              <label for="name">Name:</label>
              <input type="text" id="name" name="name" required />
            </section>

            <!-- Email Row -->
            <section class="form-group">
              <label for="email">Email:</label>
              <input type="email" id="email" name="email" required />
            </section>

            <!-- Message Row -->
            <section class="form-group">
              <label for="message">Message:</label>
              <textarea
                id="message"
                name="message"
                rows="15"
                required
              ></textarea>
            </section>
            <!-- Send Button -->
            <section class="form-group">
              <button type="submit" id="contact-form-send-button">Send</button>
            </section>
          </form>
        </article>
        <!--wide article x (end)-->
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer-container">
      <p>© Copyright 2025 Chi Tsang. All rights reserved.</p>
    </footer>
  </body>
</html>
