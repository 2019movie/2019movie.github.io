<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your short-list – First-Home Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f4f8fb;margin:0}
    header{background:#0077cc;color:#fff;padding:15px;text-align:center}
    #side{max-width:480px;margin:20px auto;padding:0 15px}
    .card{border:1px solid #ccc;border-radius:6px;padding:12px;margin-bottom:12px;background:#fff}
    .card h4{margin:0 0 6px}
    .card p{margin:4px 0;font-size:14px}
    .actions button{margin-right:8px;padding:6px 12px;border:none;border-radius:4px;cursor:pointer}
    .save{background:#28a745;color:#fff}
    .hide{background:#dc3545;color:#fff}
    /* new button bar */
    .nav-buttons{text-align:center;margin-top:25px}
    .nav-buttons a{display:inline-block;margin:0 8px;padding:10px 20px;background:#0077cc;color:#fff;text-decoration:none;border-radius:4px;font-size:16px}
  </style>
</head>
<body>
  <header>Your personalised suburb short-list</header>

  <div id="side">
    <div id="cards"></div>

    <!-- NEW BUTTONS -->
    <div class="nav-buttons">
      <a href="refine.html">Refine priorities</a>
      <a href="index.html">Start over</a>
    </div>
  </div>

  <script>
    // 1. read budget from query string
    const params = new URLSearchParams(location.search);
    const budget = parseInt(params.get('budget')) || 800000;

    // 2. fake database
    const fakeDb = [
      {name:"St Albans",price:620000,distance:"26 km",train:"34 min",school:"8/10",why:"22 % cheaper than neighbouring suburbs, future rail upgrade"},
      {name:"Rosherville",price:590000,distance:"29 km",train:"38 min",school:"7/10",why:"Large blocks, 3 parks within 1 km"},
      {name:"Holland Park",price:680000,distance:"22 km",train:"30 min",school:"8/10",why:"Café precinct + low crime"},
      {name:"Clarinda",price:640000,distance:"24 km",train:"32 min",school:"7/10",why:"Family vibe, good school catchment"},
      {name:"Epping North",price:720000,distance:"20 km",train:"28 min",school:"9/10",why:"Top schools, tech-hub nearby"}
    ].filter(s => s.price <= budget * 1.1);

    // 3. render cards
    const box = document.getElementById('cards');
    fakeDb.forEach(sub => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <h4>${sub.name}</h4>
        <p>Median $${sub.price.toLocaleString()} · ${sub.distance} · ${sub.train}</p>
        <p><strong>${sub.why}</strong></p>
        <div class="actions">
          <button class="save" onclick="alert('Saved ${sub.name}')">❤ Save</button>
          <button class="hide" onclick="this.closest('.card').remove()">✖ Hide</button>
        </div>`;
      box.appendChild(div);
    });

    // 4. empty state
    if (fakeDb.length === 0) box.innerHTML = '<p>No suburbs match your budget. Try raising it slightly.</p>';
  </script>
</body>
</html>
