<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz – First-Home Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f4f8fb;padding:20px}
    h2{margin-top:0}
    label{display:block;margin:12px 0 4px;font-weight:bold}
    input[type=number],select{width:100%;max-width:300px;padding:8px;font-size:16px}
.emoji-row small{display:block;font-size:11px;color:#555;margin-top:2px}
.emoji-row label{text-align:center;cursor:pointer}
.emoji-row input:checked+span{border:3px solid #0077cc;border-radius:50%;padding:4px}   
 .emoji-row{display:flex;justify-content:space-around;max-width:400px;margin:10px auto}
    .emoji-row label{cursor:pointer;font-size:32px}
    .emoji-row input{display:none}
    .emoji-row input:checked+span{border:3px solid #0077cc;border-radius:50%;padding:4px}
    .btn{display:inline-block;margin-top:20px;padding:10px 24px;background:#0077cc;color:#fff;border:none;border-radius:4px;font-size:16px;cursor:pointer}
  </style>
</head>
<body>
  <h2>Tell us what matters</h2>
  <form id="quizForm">
    <label>Your max budget (AUD)</label>
    <input type="number" name="budget" min="300000" max="2000000" step="50000" required>

    <label>Bedrooms needed</label>
    <select name="beds" required>
      <option value="1">1</option><option value="2">2</option>
      <option value="3" selected>3</option><option value="4">4+</option>
    </select>

    <label>Current suburb (type postcode)</label>
    <input type="text" name="work" placeholder="e.g. 6004" required>

    <label>Work suburb (type postcode)</label>
    <input type="text" name="work" placeholder="e.g. 6000" required>

<label>Pick your vibe (choose one)</label>
<div class="emoji-row">
  <label>
    <input type="radio" name="vibe" value="coffee" required>
    <span>☕</span>
    <small>Coffee</small>
  </label>
  <label>
    <input type="radio" name="vibe" value="park">
    <span>🌳</span>
    <small>Parks</small>
  </label>
  <label>
    <input type="radio" name="vibe" value="beach">
    <span>🏖️</span>
    <small>Beach</small>
  </label>
  <label>
    <input type="radio" name="vibe" value="shop">
    <span>🛍️</span>
    <small>Shops</small>
  </label>
  <label>
    <input type="radio" name="vibe" value="school">
    <span>🎒</span>
    <small>Schools</small>
  </label>
</div>

    <button class="btn" type="submit">See my suburbs</button>
  </form>

  <script>
    // very small client-side router
    document.getElementById('quizForm').addEventListener('submit', function(e){
      e.preventDefault();
      const data = new FormData(this);
      const params = new URLSearchParams(data).toString();
      //window.location = 'results.html?'+params;
      window.location = 'results.html';

    });
  </script>
</body>
</html>
